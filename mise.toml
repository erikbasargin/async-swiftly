[tasks.muter]
description = "Run Muter with the Swiftly toolchain pinned in .swift-version"
dir = "{{config_root}}"
run = "python3 scripts/muter.py --operators RelationalOperatorReplacement ChangeLogicalConnector SwapTernary"

[tasks.lint]
run = [
    "swiftly run swift format . --recursive --in-place",
    "swiftly run swift format lint . --recursive --strict",
]
