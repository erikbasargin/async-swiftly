name: Muter
run-name: 'Muter for PR #${{ github.event.issue.number }}'

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  request:
    name: Validate request
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == '/muter run' &&
      github.event.comment.user.type == 'User'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      checks: write
    outputs:
      sha: ${{ steps.request.outputs.sha }}
      check_id: ${{ steps.request.outputs.check_id }}
    steps:
      # This job never checks out or executes PR code.
      - name: Authorize command and create PR check
        id: request
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const { comment, issue } = context.payload;
            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner, repo, username: comment.user.login,
            });
            if (!['write', 'maintain', 'admin'].includes(access.permission)) {
              core.notice('Only users with repository write access can run Muter.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({
              owner, repo, pull_number: issue.number,
            });
            if (pr.state !== 'open') {
              core.notice('Muter runs only on open pull requests.');
              return;
            }

            const runURL = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const { data: check } = await github.rest.checks.create({
              owner, repo, name: 'Muter', head_sha: pr.head.sha,
              status: 'in_progress', started_at: new Date().toISOString(),
              details_url: runURL,
              output: {
                title: 'Mutation testing requested',
                summary: `Requested by [this comment](${comment.html_url}). [Workflow run](${runURL}).`,
              },
            });
            core.setOutput('sha', pr.head.sha);
            core.setOutput('check_id', check.id);

  muter:
    name: Run mutation tests
    needs: request
    if: needs.request.outputs.sha != ''
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out requested PR commit
        uses: actions/checkout@v4
        with:
          # Resolve once in the trusted job, including for fork PRs.
          ref: ${{ needs.request.outputs.sha }}
          persist-credentials: false

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install Muter, Swiftly, and mise
        run: brew install muter-mutation-testing/formulae/muter swiftly mise

      - name: Install the pinned Swift toolchain
        run: |
          swiftly init --skip-install --no-modify-profile --assume-yes
          . "$HOME/.swiftly/env.sh"
          swiftly install --assume-yes
          swiftly run swift --version
          echo "$SWIFTLY_BIN_DIR" >> "$GITHUB_PATH"

      - name: Run Muter
        timeout-minutes: 60
        env:
          REPORT_DIR: ${{ runner.temp }}/muter-results
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
        run: |
          mkdir -p "$REPORT_DIR"
          set -o pipefail
          mise run muter -- --format plain \
            --output "$REPORT_DIR/muter-report.txt" 2>&1 | tee "$REPORT_DIR/muter.log"
          test -s "$REPORT_DIR/muter-report.txt"

      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muter-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/muter-results/muter-report.txt
            ${{ runner.temp }}/muter-results/muter.log
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Publish Muter results
    needs: [request, muter]
    if: always() && needs.request.outputs.check_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: write
      pull-requests: write
    steps:
      # A fresh runner keeps the write token separate from all PR execution.
      - name: Complete PR check
        uses: actions/github-script@v8
        env:
          CHECK_ID: ${{ needs.request.outputs.check_id }}
          MUTER_RESULT: ${{ needs.muter.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runURL = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.checks.update({
              owner, repo, check_run_id: Number(process.env.CHECK_ID),
              status: 'completed', conclusion: process.env.MUTER_RESULT,
              completed_at: new Date().toISOString(), details_url: runURL,
              output: {
                title: `Muter: ${process.env.MUTER_RESULT}`,
                summary: `[View workflow logs and download report artifacts](${runURL}). A successful run does not enforce a minimum mutation score.`,
              },
            });

      - name: Download report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: muter-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/muter-results

      - name: Comment with mutation report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          MUTER_RESULT: ${{ needs.muter.result }}
          REPORT_FILE: ${{ runner.temp }}/muter-results/muter-report.txt
        run: |
          if [ -s "$REPORT_FILE" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$REPORT_FILE"
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "Muter: $MUTER_RESULT. No report was produced. See the [workflow logs]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          fi
