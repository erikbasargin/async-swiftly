name: CI

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.15
    with:
      license_header_check_project_name: "async-swiftly"
      api_breakage_check_enabled: false

  macos_checks:
    name: macOS Checks
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Swift version
        run: xcrun swift --version

      - name: Build and test
        run: xcrun swift test --parallel --enable-code-coverage

      - name: Generate coverage report
        shell: bash
        run: |
          shopt -s failglob
          objects=()
          for binary in .build/debug/*.xctest/Contents/MacOS/*; do
            objects+=(-object "$binary")
          done

          xcrun llvm-cov export \
            -format=lcov \
            -instr-profile=.build/debug/codecov/default.profdata \
            -ignore-filename-regex='/(Tests|\.build)/' \
            "${objects[@]}" \
            > coverage.lcov

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          disable_search: true
          fail_ci_if_error: true

  simulator_checks:
    name: ${{ matrix.platform }} Checks
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: 'platform=iOS Simulator,name=iPhone 17,OS=27.0'
          - platform: watchOS
            destination: 'platform=watchOS Simulator,name=Apple Watch SE 3 (40mm),OS=27.0'
          - platform: tvOS
            destination: 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation),OS=27.0'
          - platform: visionOS
            destination: 'platform=visionOS Simulator,name=Apple Vision Pro,OS=27.0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun simctl list devices available

      - name: Build and test
        env:
          DESTINATION: ${{ matrix.destination }}
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme async-swiftly \
            -destination "$DESTINATION" \
            -resultBundlePath "$RUNNER_TEMP/simulator-results.xcresult" \
            2>&1 | xcbeautify --renderer github-actions

      - name: Upload failed simulator test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: simulator-${{ matrix.platform }}-xcresult
          path: ${{ runner.temp }}/simulator-results.xcresult
          if-no-files-found: ignore
          retention-days: 7

  stress_testing:
    name: Stress Testing
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          NSUnbufferedIO=YES bash scripts/stress.sh 2>&1 | xcbeautify --renderer github-actions

      - name: Upload failed stress test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: stress-xcresult
          path: .build/stress/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  linux_checks:
    name: Linux Checks
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.15
    with:
      enable_windows_checks: false
      linux_swift_versions: "[\"nightly-6.4.x\"]"

  windows_checks:
    name: Windows Checks
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.15
    with:
      enable_linux_checks: false
      windows_swift_versions: "[\"nightly-6.4.x\"]"
